project:
  name: EcomNLU
  random_seed: 42

data:
  raw_path: data/raw/online_shopping_10_cats.csv
  interim_dir: data/interim
  processed_dir: data/processed
  text_column: review
  category_column: cat
  sentiment_column: label
  train_ratio: 0.8
  dev_ratio: 0.1
  test_ratio: 0.1

task:
  primary: category_classification
  secondary: sentiment_classification
  categories:
    - 书籍
    - 平板
    - 手机
    - 水果
    - 洗发水
    - 热水器
    - 蒙牛
    - 衣服
    - 计算机
    - 酒店
  # 情感任务的标签顺序（M5）。与原始数据 label 列的语义一致（0 为负向、1 为正向），
  # 顺序固定不得调换：它是契约 v1.2 §2.1 规定的 label_mapping.json 取值来源，
  # 校验器、训练脚本与 Web 层都必须读这里，不得各自硬编码。
  sentiment_categories:
    - 负向
    - 正向

evaluation:
  primary_metric: macro_f1
  report_metrics:
    - accuracy
    - macro_precision
    - macro_recall
    - macro_f1
    - weighted_f1

api:
  # 单条评论长度上限（字符）。超过返回 REVIEW_TOO_LONG，不静默截断。
  # 本数据集评论 p99 为 374 字符、最长 2876 字符，取 2000 可覆盖绝大多数真实输入，
  # 同时保留一个可现场演示的超长输入拒绝路径。
  max_review_chars: 2000

# POST /api/v1/nlu/analyze（EcomPilot / EcomOps 等上游调用）。类别 -> 业务侧编码的映射放在配置里：
# category_code 是本项目稳定编码；catalog_category_id 是店铺商品目录里的品类 id（换店铺只改这里）。
# 没有对应目录品类的类别写 null，调用方就不会拿到一个指向不存在品类的提示。
analyze:
  confidence_threshold: 0.65     # 低于此置信度的子句输出 ABSTAIN，宁可不给提示
  max_clauses: 5                 # 一次最多分析的子句数，超出部分丢弃
  max_text_chars: 500
  not_applicable_scenes: [PDF_BODY, CS_APOLOGY]       # 评论分类模型不适用的场景，直接返回 scene_not_applicable
  priority_boost_scenes: [AFTER_SALE_FEEDBACK, aftersales]   # 这些场景下情感为负向且得分达标时 priority_boost=true
  priority_boost_min_score: 0.85   # 负向得分低于此值不加急（路线图图 2-1：NEGATIVE 且 score>=0.85）
  categories:
    书籍:   {category_code: BOOK,        catalog_category_id: BOOKS}
    平板:   {category_code: TABLET,      catalog_category_id: DIGITAL_TABLET}
    手机:   {category_code: PHONE,       catalog_category_id: null}
    水果:   {category_code: FRUIT,       catalog_category_id: null}
    洗发水: {category_code: SHAMPOO,     catalog_category_id: PERSONAL_SHAMPOO}
    热水器: {category_code: WATER_HEATER, catalog_category_id: HOME_APPLIANCE_HEATER}
    蒙牛:   {category_code: DAIRY,       catalog_category_id: DAIRY_MILK, brand_hint: 蒙牛}
    衣服:   {category_code: CLOTHING,    catalog_category_id: null}
    计算机: {category_code: COMPUTER,    catalog_category_id: null}
    酒店:   {category_code: HOTEL,       catalog_category_id: TRAVEL_HOTEL, item_type: SERVICE}
